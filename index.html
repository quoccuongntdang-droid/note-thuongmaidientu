<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Ghi Chú Cá Nhân</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="content">Đang tải nội dung...</div>

  <script>
    // Đọc trực tiếp file markdown trong thư mục Vault
    fetch('Vault/ghi-chu-1.md')
      .then(response => response.text())
      .then(text => {
        document.getElementById('content').innerHTML = marked.parse(text);
      })
      .catch(err => {
        document.getElementById('content').innerText = 'Không thể nạp ghi chú. Vui lòng kiểm tra lại đường dẫn file.';
      });
  </script>
</body>
</html>
